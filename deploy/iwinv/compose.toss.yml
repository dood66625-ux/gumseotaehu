# Separate fixed-fixture PG sandbox. Not part of the customer app or auto start.
name: gumseo-toss
services:
  sandbox:
    image: gumseo-local-worker:local
    user: '1000:1000'
    working_dir: /app
    network_mode: host
    env_file: /etc/gumseo/toss-sandbox.env
    environment:
      APP_MODE: local
      EXTERNAL_EFFECTS: disabled
      APP_ORIGIN: http://127.0.0.1:3211
    volumes:
      - /var/lib/gumseo-toss:/app/var
    command: [node, dist/toss-sandbox.js, --test-network]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3211/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: 'no'
