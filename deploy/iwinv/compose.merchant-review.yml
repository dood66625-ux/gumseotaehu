name: gumseo-merchant-review
services:
  assets:
    image: gumseo-local-web:local
    user: '0:0'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [review-static:/review-site]
    entrypoint: [node, -e]
    command: ["const f=require('node:fs');f.cpSync('/app/public/merchant-review','/review-site',{recursive:true});f.chmodSync('/review-site',0o755)"]
    restart: 'no'
  review:
    image: gumseo-local-worker:local
    user: '1000:1000'
    working_dir: /app
    network_mode: host
    env_file: /etc/gumseo/toss-sandbox.env
    environment:
      APP_MODE: local
      EXTERNAL_EFFECTS: disabled
      MERCHANT_REVIEW_ORIGIN: https://pay.gumseo.kr
    volumes: [/var/lib/gumseo-merchant-review:/app/var]
    command: [node, dist/merchant-review.js, --test-network]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3212/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
  proxy:
    image: caddy:2.11.9-alpine
    network_mode: host
    volumes:
      - /usr/local/lib/gumseo/Caddyfile.merchant-review:/etc/caddy/Caddyfile:ro
      - review-static:/srv:ro
      - review-tls:/data
      - review-config:/config
    depends_on:
      assets: {condition: service_completed_successfully}
      review: {condition: service_healthy}
    restart: unless-stopped
volumes:
  review-static:
  review-tls:
  review-config:
