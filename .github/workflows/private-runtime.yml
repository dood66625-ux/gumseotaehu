name: Build private mock runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'db/**'
      - 'assets/**'
      - 'public/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/private-runtime.yml'
concurrency:
  group: private-mock-runtime
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: python3 -m unittest discover -s tests -p 'test_iwinv_automation.py'
      - run: npm run build
      - run: python3 -m unittest discover -s tests -p 'test_merchant_review_server.py'
      - run: npm run runtime:package -- var/private-runtime
      - name: Build images without server compilation
        run: |
          docker build --target web -t gumseo-local-web:local var/private-runtime
          docker build --target worker -t gumseo-local-worker:local var/private-runtime
          mkdir -p var/private-release
          docker save gumseo-local-web:local gumseo-local-worker:local | gzip > var/private-release/images.tar.gz
          cp compose.local.yml var/private-release/compose.local.yml
          git rev-parse HEAD > var/private-release/COMMIT
          cd var/private-release
          sha256sum images.tar.gz compose.local.yml COMMIT > SHA256SUMS
      - name: Publish credential-free mock images for private server updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 48); do
            result=$(gh run list --workflow check.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion --jq '.[0] | if .status == "completed" then .conclusion else "pending" end')
            if [ "$result" = success ]; then break; fi
            if [ "$result" != pending ] && [ "$result" != null ] && [ -n "$result" ]; then
              echo 'Related verification did not succeed; package not published.'
              exit 1
            fi
            sleep 10
          done
          test "$result" = success
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          tar -cf var/mock-release.tar -C var/private-release images.tar.gz compose.local.yml COMMIT SHA256SUMS
          tag="gumseo-mock-$GITHUB_SHA"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" var/mock-release.tar --target "$GITHUB_SHA" --prerelease --title "Mock runtime $GITHUB_SHA" --notes "Public code-only images. No keys, customer data or operating site. Private mock server update package."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: private-mock-runtime-${{ github.sha }}
          path: var/private-release/
          retention-days: 3
          if-no-files-found: error
