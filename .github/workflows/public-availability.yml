name: Public availability check
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert && 'ALERT DELIVERY TEST - no service outage' || 'Public availability check' }}
# Commercial public paths and anonymous protection checks only. GitHub notification delivery depends on the owner account settings.
on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: Intentional notification test; does not stop or change the service
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: public-availability
  cancel-in-progress: false
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Intentional alert delivery test - no service outage
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
        shell: bash
        run: |
          echo "::error title=ALERT DELIVERY TEST::This is an intentional notification test. No service outage was caused."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fixed public HTTPS endpoints
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/public-availability.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1
