name: Public availability check
# Fixed public probes only. GitHub notification delivery depends on the owner account settings.
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: public-availability
  cancel-in-progress: false
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fixed public HTTPS endpoints
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/public-availability.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1
