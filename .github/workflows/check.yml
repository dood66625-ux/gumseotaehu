name: Local verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  focused:
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - name: Test changed modules; fall back to unit suite if base unavailable
        shell: bash
        run: |
          if [[ "$TEST_BASE" =~ ^[0-9a-f]{40}$ ]] && git fetch --no-tags --depth=1 origin "$TEST_BASE"; then
            npx vitest run --changed="$TEST_BASE" --passWithNoTests
          else
            npm test
          fi
      - run: npm run check:secrets
  check:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck && npm test && npm run build
      - run: npm run runtime:package -- var/runtime-ci
      - run: npm run readiness -- --expect-blocked
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:toss-browser
      - run: npm run build:preview
      - run: npm run check:secrets
      - run: npm run preview:serve > /tmp/geumseo-preview.log 2>&1 &
      - run: npm run test:preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-test-evidence
          path: |
            docs/e2e-results.json
            docs/public-preview-test.json
            docs/public-preview-report.png
            docs/*-landing.png
            docs/*-preview.png
            docs/*-report.png
            docs/*-report.pdf
            docs/*-admin.png
            playwright-report/
